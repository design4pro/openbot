name: Computer Use driver pin

# The driver is a vendor release, pinned by tag, asset digest, and one digest per shipped file.
# The install job checks integrity. Separate manual jobs check native and application behavior.
# Nothing builds it, so there is no recipe to check - only the question of whether the pin still
# resolves. `release.yml` is the first place that asks today, which makes a deleted or rewritten
# upstream asset a failure at tag time. This job asks on the pull request that moves the pin, and
# once a week for a pin that stopped resolving while nobody touched it.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cua-driver.yml"
      - "native-runtime.lock.json"
      - "scripts/cua-driver-archive.ts"
      - "scripts/cua-driver-lock.ts"
      - "scripts/install-cua-driver.ts"
      - "scripts/pin-cua-driver.ts"
      - "scripts/runtime-install.ts"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      planning_evidence:
        description: "Privacy evidence on a disposable desktop; app requires the reviewed isolated runner"
        type: choice
        required: true
        default: none
        options: [none, native, app]

permissions:
  contents: read

concurrency:
  group: cua-driver-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-planning:
    if: github.event_name == 'workflow_dispatch' && inputs.planning_evidence == 'native'
    name: Native planning behavior on an empty Xvfb desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth python3-xlib
      - run: bun scripts/install-cua-driver.ts
      - run: bun scripts/install-remote-desktop-runtime.ts
      - name: Run actual native behavior
        env:
          OPENBOT_PLANNING_ISOLATED: xvfb
        run: xvfb-run -a sh -c 'bun scripts/project-planning-e2e.ts --group native --isolated-display="$DISPLAY"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: planning-native-behavior
          path: .openbot-build/project-planning/
          if-no-files-found: error

  application-planning:
    if: github.event_name == 'workflow_dispatch' && inputs.planning_evidence == 'app'
    name: Reviewed isolated planning application proof
    # Dedicated disposable VM/container only: no personal desktop, host profile, credentials or devices.
    # The compiled support map must match this runner. No report or environment flag can enable it.
    runs-on: [self-hosted, linux, x64, openbot-planning-isolated]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun scripts/install-cua-driver.ts
      - run: bun scripts/install-remote-desktop-runtime.ts
      - name: Run supervised Electron, UI, file and remote proof
        env:
          OPENBOT_PLANNING_ISOLATED: xvfb
        run: xvfb-run -a bun scripts/project-planning-launch-e2e.ts --mode=full
      - name: Verify application report rejection and owned-worker failure
        run: |
          report=$(rg --files --hidden --no-ignore .openbot-build/project-planning | rg '/remote/report.json$' | head -1)
          bun scripts/project-planning-report-e2e.ts --report="$report" --app-report="$report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: planning-reviewed-application
          path: .openbot-build/project-planning/
          if-no-files-found: error

  install:
    # Every target, because each release job installs its own and a pin that resolves for one
    # platform says nothing about the others. The installer checks the archive digest, then each
    # file's digest after extraction, so a download that answers is not by itself a pass.
    name: Install the pinned driver (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            architecture: arm64
          - target: darwin-x64
            platform: darwin
            architecture: x64
          - target: win32-x64
            platform: win32
            architecture: x64
          - target: linux-x64
            platform: linux
            architecture: x64
          - target: linux-arm64
            platform: linux
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Install and verify the pinned driver
        run: bun scripts/install-cua-driver.ts ${{ matrix.platform }} ${{ matrix.architecture }}
